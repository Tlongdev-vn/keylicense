<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TLONG SYSTEM - YOUR KEY</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Segoe UI', sans-serif; }
        body { background: #090a0f; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: rgba(22, 27, 34, 0.75); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 24px; padding: 36px 28px; width: 100%; max-width: 420px; text-align: center; }
        .icon-wrapper { width: 80px; height: 80px; background: rgba(16, 185, 129, 0.15); border: 2px solid #10b981; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 24px; font-size: 38px; color: #10b981; }
        h1 { font-size: 22px; font-weight: 800; margin-bottom: 8px; color: #10b981; }
        p.sub { font-size: 13px; color: #94a3b8; margin-bottom: 24px; }
        .key-container { background: #0d1117; border: 1px dashed #10b981; padding: 18px; border-radius: 14px; font-family: monospace; font-size: 15px; color: #34d399; word-break: break-all; margin-bottom: 24px; font-weight: 700; min-height: 58px; display: flex; align-items: center; justify-content: center; }
        .btn-copy { width: 100%; padding: 16px; background: linear-gradient(90deg, #059669, #10b981); border: none; color: white; font-weight: 700; border-radius: 14px; cursor: pointer; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-wrapper">✓</div>
        <h1>VƯỢT LINK THÀNH CÔNG!</h1>
        <p class="sub">Key PWF Auth chính thức của bạn đã được khởi tạo:</p>
        
        <div class="key-container" id="keyDisplay">
            <span style="color: #38bdf8;">⏳ Đang tạo Key từ PWF Auth...</span>
        </div>
        
        <button class="btn-copy" onclick="copyKey()">📋 SAO CHÉP KEY VÀO ROBLOX</button>
    </div>

    <script>
        async function fetchPwfKey() {
            const keyDisplay = document.getElementById('keyDisplay');
            try {
                const response = await fetch('/api/getkey');
                const data = await response.json();

                if (data.success && data.key) {
                    keyDisplay.innerText = data.key;
                    keyDisplay.style.borderStyle = "solid";
                } else {
                    keyDisplay.innerHTML = `<span style="color: #f87171;">❌ ${data.message || 'Lỗi tạo Key!'}</span>`;
                }
            } catch (err) {
                keyDisplay.innerHTML = '<span style="color: #f87171;">❌ Lỗi kết nối Server!</span>';
            }
        }

        function copyKey() {
            const keyText = document.getElementById('keyDisplay').innerText;
            if (keyText.includes("❌") || keyText.includes("⏳")) return;
            navigator.clipboard.writeText(keyText);
            alert("Đã sao chép Key PWF Auth vào bộ nhớ tạm!");
        }

        fetchPwfKey();
    </script>
</body>
</html>
